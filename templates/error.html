<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} | SAPS-DCMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}">
</head>
<body>
  <div class="error-page">
    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="">
    <h1>{{ code }}</h1>
    <p>{{ message }}</p>
    <a href="{{ url_for('common.dashboard') if session.get('user_id') else url_for('public.index') }}" class="btn btn-primary">Go back</a>
  </div>
</body>
</html>
